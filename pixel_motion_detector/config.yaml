name: "Pixel Motion Detector"
version: "0.1.5"
slug: "pixel_motion_detector"
description: "Lightweight pixel-change motion detection for Home Assistant cameras."
url: "https://github.com/DirectedHunt42/VideoMotionDetector"
startup: "application"
boot: "auto"
init: true
arch:
  - amd64
  - aarch64
options:
  ha_url: "http://homeassistant:8123"
  ha_token: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  cameras: []
  sensitivity: 60
  pixel_delta: 25
  poll_interval: 1.0
  motion_off_delay: 5
  count_continuous_motion: false
schema:
  ha_url: str
  ha_token: password
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  cameras:
    - entity_id: str
      name: str?
  sensitivity: int(1,100)
  pixel_delta: int(1,255)
  poll_interval: float(0.2,10)
  motion_off_delay: int(0,300)
  count_continuous_motion: bool
